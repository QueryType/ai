# llama-server router mode preset file
# Usage:
#   llama-server \
#     --models-dir /Volumes/d/aimodels \
#     --models-preset /path/to/router-preset.ini \
#     --models-max 1 \
#     --host 0.0.0.0 --port 8080
#
# NOTE: newer llama-server builds enable router mode automatically when
# --models-dir/--models-preset are set — no separate --router flag needed.
#
# Preset syntax: "key = value" (no leading dashes), section name is the
# model id used for routing (matches config.yaml's "model" field).
#
# --models-max 1 means only one model loaded at a time (LRU eviction).

version = 1

[gemma-12b]
model = /Volumes/d/aimodels/lmstudio-community/gemma-4-12B-it-QAT-GGUF/gemma-4-12B-it-QAT-Q4_0.gguf
ctx-size = 32768
n-gpu-layers = 99

