<svg width="880" height="562" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#94a3b8"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#cbd5e1"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect width="880" height="562" rx="14" fill="#f8fafc"/>

  <!-- title -->
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Component Architecture</text>
  <text x="440" y="52" text-anchor="middle" font-size="11" fill="#94a3b8">self-improving-loop — files, roles, and connections</text>

  <!-- ── Band 1: CLI ─────────────────────────────────────── -->
  <rect x="14" y="64" width="852" height="76" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="28" y="80" font-size="9" font-weight="700" fill="#2563eb" letter-spacing="1.5">CLI</text>
  <rect x="220" y="74" width="440" height="50" rx="7" fill="#2563eb"/>
  <text x="440" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">python loop.py</text>
  <text x="440" y="113" text-anchor="middle" font-size="10" fill="#bfdbfe">--task  --prompt  --search  --search-depth  --iterations  --threshold  --list  --show</text>

  <!-- arrow down -->
  <line x1="440" y1="140" x2="440" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ── Band 2: Orchestration ───────────────────────────── -->
  <rect x="14" y="156" width="852" height="82" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="28" y="172" font-size="9" font-weight="700" fill="#6d28d9" letter-spacing="1.5">ORCHESTRATION</text>
  <rect x="215" y="166" width="450" height="62" rx="7" fill="#6d28d9"/>
  <text x="440" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">loop.py</text>
  <text x="440" y="205" text-anchor="middle" font-size="10" fill="#ddd6fe">run_loop() · pre-search step · session save/load</text>
  <text x="440" y="220" text-anchor="middle" font-size="10" fill="#ddd6fe">early-stop logic · best-result tracking · ANSI display</text>

  <!-- three arrows down to core -->
  <line x1="265" y1="238" x2="155" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="238" x2="440" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="615" y1="238" x2="725" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ── Band 3: Core Modules ────────────────────────────── -->
  <rect x="14" y="248" width="852" height="108" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="28" y="264" font-size="9" font-weight="700" fill="#15803d" letter-spacing="1.5">CORE MODULES</text>

  <!-- config.py -->
  <rect x="36" y="270" width="200" height="74" rx="7" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="36" y="270" width="200" height="22" rx="7" fill="#dcfce7"/>
  <rect x="36" y="283" width="200" height="9" fill="#dcfce7"/>
  <text x="136" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">config.py</text>
  <text x="136" y="305" text-anchor="middle" font-size="9" fill="#374151">reads config.yaml at import</text>
  <text x="136" y="319" text-anchor="middle" font-size="9" fill="#374151">exports cfg · PROFILES</text>
  <text x="136" y="333" text-anchor="middle" font-size="9" fill="#374151">injects rubric into critic prompt</text>

  <!-- phases.py -->
  <rect x="330" y="270" width="220" height="74" rx="7" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="330" y="270" width="220" height="22" rx="7" fill="#dcfce7"/>
  <rect x="330" y="283" width="220" height="9" fill="#dcfce7"/>
  <text x="440" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">phases.py</text>
  <text x="440" y="305" text-anchor="middle" font-size="9" fill="#374151">generate(task, prompt, profile, ctx)</text>
  <text x="440" y="319" text-anchor="middle" font-size="9" fill="#374151">critique(task, prompt, response, profile)</text>
  <text x="440" y="333" text-anchor="middle" font-size="9" fill="#374151">refine(task, prompt, response, crit, profile)</text>

  <!-- tools.py -->
  <rect x="644" y="270" width="200" height="74" rx="7" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="644" y="270" width="200" height="22" rx="7" fill="#dcfce7"/>
  <rect x="644" y="283" width="200" height="9" fill="#dcfce7"/>
  <text x="744" y="286" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">tools.py</text>
  <text x="744" y="305" text-anchor="middle" font-size="9" fill="#374151">web_search(query, depth, topic)</text>
  <text x="744" y="319" text-anchor="middle" font-size="9" fill="#374151">fetch_url(url, max_chars)</text>
  <text x="744" y="333" text-anchor="middle" font-size="9" fill="#374151">lazy TavilyClient via TAVILY_API_KEY</text>

  <!-- arrows from core → resources -->
  <line x1="136" y1="356" x2="136" y2="370" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="356" x2="440" y2="370" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- dashed: phases.py → llama-server -->
  <line x1="390" y1="356" x2="270" y2="462" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ad)"/>
  <!-- dashed: tools.py → Tavily -->
  <line x1="744" y1="356" x2="680" y2="462" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ad)"/>

  <!-- ── Band 4: Resources ───────────────────────────────── -->
  <rect x="14" y="366" width="852" height="84" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="28" y="382" font-size="9" font-weight="700" fill="#b45309" letter-spacing="1.5">RESOURCES</text>

  <!-- config.yaml -->
  <rect x="36" y="384" width="200" height="56" rx="7" fill="#fff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="136" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">config.yaml</text>
  <text x="136" y="421" text-anchor="middle" font-size="9" fill="#374151">3 LLM profiles · rubric dims</text>
  <text x="136" y="434" text-anchor="middle" font-size="9" fill="#374151">loop settings · router-preset.ini</text>

  <!-- prompts/ -->
  <rect x="330" y="384" width="220" height="56" rx="7" fill="#fff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="440" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">prompts/</text>
  <text x="440" y="421" text-anchor="middle" font-size="9" fill="#374151">generator_system.md</text>
  <text x="440" y="434" text-anchor="middle" font-size="9" fill="#374151">critic_system.md · refiner_system.md</text>

  <!-- sessions/ -->
  <rect x="644" y="384" width="200" height="56" rx="7" fill="#fff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="744" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">sessions/</text>
  <text x="744" y="421" text-anchor="middle" font-size="9" fill="#374151">20260704_143022.json</text>
  <text x="744" y="434" text-anchor="middle" font-size="9" fill="#374151">full history · best prompt + score</text>

  <!-- loop.py → sessions/ curved right-edge arrow -->
  <path d="M 665,197 C 866,197 866,412 844,412" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#ad)"/>
  <text x="874" y="310" text-anchor="middle" font-size="8" fill="#94a3b8" transform="rotate(-90 874 310)">save session</text>

  <!-- ── Band 5: External Services ──────────────────────── -->
  <rect x="14" y="458" width="852" height="82" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="28" y="474" font-size="9" font-weight="700" fill="#be123c" letter-spacing="1.5">EXTERNAL SERVICES</text>

  <!-- llama-server -->
  <rect x="80" y="478" width="310" height="52" rx="7" fill="#fff" stroke="#fda4af" stroke-width="1.5"/>
  <text x="235" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">llama-server</text>
  <text x="235" y="516" text-anchor="middle" font-size="9" fill="#374151">OpenAI-compat API · router mode · build b9833</text>
  <text x="235" y="523" text-anchor="middle" font-size="8" fill="#94a3b8">--models-dir · --models-preset · --models-max</text>

  <!-- Tavily API -->
  <rect x="490" y="478" width="300" height="52" rx="7" fill="#fff" stroke="#fda4af" stroke-width="1.5"/>
  <text x="640" y="500" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">Tavily API</text>
  <text x="640" y="516" text-anchor="middle" font-size="9" fill="#374151">web_search (basic / advanced) · fetch_url extract</text>
  <text x="640" y="523" text-anchor="middle" font-size="8" fill="#94a3b8">TAVILY_API_KEY env · optional (--search flag)</text>

</svg>
